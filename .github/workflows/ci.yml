name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# New pushes supersede older runs on the same ref: cancel them instead of
# burning runners on code that's already outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node sync-embeds.mjs --check
      - name: bench (regression check, small N)
        run: npm run bench
        env:
          AB_BENCH_N: 50

  lead-e2e:
    # Boot a REAL headless opencode and run the lead-assign E2E (lane
    # auto-provision, coordinator reuse, kill/respawn contract). CI-only job:
    # local `npm test` keeps skipping those E2Es when opencode isn't
    # installed, so this lane is the only place they run in automation.
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # npm i -g installs the real shim the DEP0190 changes migrate
      # (`opencode` is probed with `where`/`which` and booted via buildSpawnTarget).
      - name: install opencode (headless cli)
        run: npm install -g opencode-ai
      - name: run the harness-backed lead E2E suites
        run: |
          node test/crewbus.kidproc.mjs
          node test/crewbus.lead-assign.mjs
          node test/crewbus.lead-budget.mjs
