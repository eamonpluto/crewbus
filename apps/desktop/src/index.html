<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrewBus</title>
<script>
try{var __t=null;try{__t=localStorage.getItem('crewbus-desktop-theme');}catch(_){}if(__t==='light'||__t==='dark'){document.documentElement.setAttribute('data-theme',__t);}}catch(_){}
</script>
<style>
:root{
  --bg:#f4f6f3;
  --panel:#ffffff;
  --ink:#14201a;
  --dim:#5b6a62;
  --acc:#5b6a62;
  --acc-ink:#ffffff;
  --ok:#3d8f66;
  --warn:#b86e00;
  --line:#d5ddd7;
  --scroll:rgba(0,0,0,.18);
  --scroll-hi:rgba(0,0,0,.32);
  --danger:#f85149;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1419;--panel:#182028;--ink:#e3e9ee;--dim:#8b98a5;--acc:#8b98a5;--acc-ink:#07130d;--ok:#4fb07f;--warn:#ffb454;--line:#2a343e;
  --scroll:rgba(255,255,255,.16);
  --scroll-hi:rgba(255,255,255,.32);
}}
:root[data-theme="light"]{--bg:#f4f6f3;--panel:#ffffff;--ink:#14201a;--dim:#5b6a62;--acc:#5b6a62;--acc-ink:#ffffff;--ok:#3d8f66;--warn:#b86e00;--line:#d5ddd7;--scroll:rgba(0,0,0,.18);--scroll-hi:rgba(0,0,0,.32)}
:root[data-theme="dark"]{--bg:#0f1419;--panel:#182028;--ink:#e3e9ee;--dim:#8b98a5;--acc:#8b98a5;--acc-ink:#07130d;--ok:#4fb07f;--warn:#ffb454;--line:#2a343e;--scroll:rgba(255,255,255,.16);--scroll-hi:rgba(255,255,255,.32)}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--scroll) transparent;
}
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--scroll);
  border-radius: 9999px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--scroll-hi);
}
::-webkit-scrollbar-thumb:active {
  background: var(--acc);
}
::-webkit-scrollbar-corner {
  background: transparent;
}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;height:100vh}
#shellbar{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;background:var(--panel);border-bottom:1px solid var(--line);padding:0 14px;height:38px;box-sizing:border-box}
.brand{font-weight:700;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px;letter-spacing:-0.2px}
.brand picture{display:inline-flex;align-items:center}
.brand img{height:24px;width:auto;display:block}
.status-pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:2px 8px;font-size:11px}
#conn-dot{font-size:11px;color:var(--dim)}
.dim{color:var(--dim);font-size:11px}
.spacer{flex:1}
button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:3px 10px;font-size:11px;cursor:pointer;transition:all .15s}
button:hover{border-color:var(--acc);color:var(--acc)}
button.ghost{border-color:var(--line);color:var(--ink)}
button.ghost:hover{border-color:var(--acc);color:var(--acc)}
#theme-toggle{display:inline-flex;align-items:center;justify-content:center;padding:3px 8px}
#dashboard{width:100%;height:calc(100vh - 38px);border:0;background:var(--bg);display:block}
#status{padding:4px 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:11px;color:var(--dim)}
label.switch{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<header id="shellbar">
  <div class="brand"><picture><source srcset="assets/brand/crewbus-logo-for-dark.png" media="(prefers-color-scheme: dark)"><img src="assets/brand/crewbus-logo-for-light.png" alt="CrewBus" width="82" height="24" onerror="this.onerror=null;this.src='assets/brand/logo.svg'"></picture></div>
  <div class="status-pill">
    <span id="conn-dot" title="connection: unknown">&#9679;</span>
    <span id="sidecar-url" class="dim">sidecar: connecting&hellip;</span>
  </div>
  <div class="spacer"></div>
  <button id="board-open" class="ghost" title="Use another folder's board (e.g. a CLI project)">Switch Board…</button>
  <label class="switch" title="Off = remote-only: stops the sidecar WITHOUT deleting board state">
    <input id="local-env" type="checkbox" checked> Local environment
  </label>
  <button id="pair-open" class="ghost" title="Pair a mobile device via QR code">Pair Mobile (QR)</button>
  <button id="theme-toggle" type="button" title="Toggle light/dark theme" aria-label="Toggle light/dark theme"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>
<div id="status" class="dim">waiting for the sidecar dashboard URL&hellip;</div>
<!--
  The dashboard UI is NOT duplicated here: this iframe loads the sidecar's
  own page (bin/lib/web.js renderBoardHtml via the additive `serve GET /`
  route, M4b). All Boards/Crews/Fleet/Channels/Triage/Approvals/Results/
  Audit/Settings UI stays server-rendered. This shell only owns: the
  sidecar URL, the connection dot, the Local-environment toggle, and the
  pair-QR window button.
-->
<iframe id="dashboard" title="CrewBus dashboard" src="about:blank"></iframe>
<script type="module" src="./main.js"></script>
</body>
</html>
