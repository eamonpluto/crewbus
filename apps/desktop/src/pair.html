<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair a device — CrewBus</title>
<script>
try{var __t=null;try{__t=localStorage.getItem('crewbus-desktop-theme');}catch(_){}if(__t==='light'||__t==='dark'){document.documentElement.setAttribute('data-theme',__t);}}catch(_){}
</script>
<style>
:root{
  --bg:#f4f6f3;
  --panel:#ffffff;
  --ink:#14201a;
  --dim:#5b6a62;
  --acc:#0e8a55;
  --acc-ink:#ffffff;
  --warn:#b86e00;
  --line:#d5ddd7;
  --scroll:rgba(0,0,0,.18);
  --scroll-hi:rgba(0,0,0,.32);
  --danger:#f85149;
  --danger-bg:rgba(248,81,73,0.12);
  --ok:#0e8a55;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1419;--panel:#182028;--ink:#e3e9ee;--dim:#8b98a5;--acc:#4cc38a;--acc-ink:#07130d;--warn:#ffb454;--line:#2a343e;
  --scroll:rgba(255,255,255,.16);
  --scroll-hi:rgba(255,255,255,.32);
  --ok:#4cc38a;
}}
:root[data-theme="light"]{--bg:#f4f6f3;--panel:#ffffff;--ink:#14201a;--dim:#5b6a62;--acc:#0e8a55;--acc-ink:#ffffff;--warn:#b86e00;--line:#d5ddd7;--scroll:rgba(0,0,0,.18);--scroll-hi:rgba(0,0,0,.32);--ok:#0e8a55}
:root[data-theme="dark"]{--bg:#0f1419;--panel:#182028;--ink:#e3e9ee;--dim:#8b98a5;--acc:#4cc38a;--acc-ink:#07130d;--warn:#ffb454;--line:#2a343e;--scroll:rgba(255,255,255,.16);--scroll-hi:rgba(255,255,255,.32);--ok:#4cc38a}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--scroll) transparent;
}
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--scroll);
  border-radius: 9999px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--scroll-hi);
}
::-webkit-scrollbar-thumb:active {
  background: var(--acc);
}
::-webkit-scrollbar-corner {
  background: transparent;
}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px;box-sizing:border-box}
h2{margin:0 0 6px;font-size:17px;font-weight:700;color:var(--ink)}
.dim{color:var(--dim);font-size:12px;line-height:1.4}
#qr-wrap{width:220px;height:220px;margin:16px auto;border:1px solid var(--line);background:var(--panel);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;overflow:hidden;box-sizing:border-box}
#qr-wrap svg{width:100%;height:100%;display:block;border-radius:6px}
#qr{color:var(--dim);font-size:12px}
textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:12px;box-sizing:border-box;resize:vertical;font-family:monospace}
textarea:focus{border-color:var(--acc);outline:none}
.btn-row{display:flex;gap:8px;margin-top:10px}
button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
button:hover{border-color:var(--acc);color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button.primary:hover{background:var(--acc);filter:brightness(1.1);color:var(--acc-ink)}
#msg{min-height:1.5em;margin-top:10px;font-size:12px}
.warn{color:var(--danger)}
.ok{color:var(--ok)}
</style>
</head>
<body>
<h2>Pair Mobile Client</h2>
<p class="dim">A one-time pairing link is minted automatically from the local
board — scan the QR with CrewBus Mobile. (Advanced: paste a
<code>crewbus://pair</code> URL from <code>relay pair qr</code> or
<code>serve --pair-qrcode</code> to render it instead.)</p>

<div id="qr-wrap">
  <div id="qr" aria-label="pairing QR">QR code will appear here after rendering</div>
</div>

<label class="dim" for="pair-url">Pairing URL (in-memory only, secret in #fragment never saved):</label>
<textarea id="pair-url" rows="3" placeholder="crewbus://pair?env=…&amp;routes=…&amp;caps=…#abp-…"></textarea>

<div class="btn-row">
  <button id="pair-render" class="primary">Render QR</button>
  <button id="pair-clear">Clear</button>
</div>

<div id="msg" class="dim" role="status"></div>
<script type="module" src="./pair.js"></script>
</body>
</html>
